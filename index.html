<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BJ1 Library</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f4;color:#171717;font-family:Kanit,sans-serif}header{background:#171717;color:#ffd32a;padding:22px;font-size:26px}small{display:block;color:#777}main{max-width:1100px;margin:auto;padding:18px}section,.card{background:white;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px #0001}input,button,select{font:inherit;padding:12px;border:1px solid #ddd;border-radius:9px;margin:4px;max-width:100%}button{background:#ffd32a;border:0;cursor:pointer;font-weight:500}nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.stats b{font-size:30px;display:block}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}.scroll{overflow:auto}dialog{border:0;border-radius:18px;padding:28px;max-width:90%;text-align:center}dialog::backdrop{background:#0008}#reader{max-width:420px} [hidden]{display:none!important} @media print{header,nav,button,#login,#reader{display:none!important}}
:root{--gold:#facc15;--ink:#20242c;--muted:#64748b}body{background:#f2f4f8;color:var(--ink)}header{position:sticky;top:0;z-index:2;padding:14px 26px;font-weight:600;letter-spacing:.5px}main{max-width:1500px;padding:24px}#login{max-width:440px;margin:9vh auto;padding:32px}#login input,#login button{width:100%;margin:6px 0}#app:not([hidden]){display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}nav{position:sticky;top:100px;display:flex;flex-direction:column;background:#20242c;padding:14px;border-radius:18px;gap:6px}nav button{background:transparent;color:#e5e7eb;text-align:left;margin:0;padding:12px 16px}nav button:hover,nav button.active{background:var(--gold);color:#171717}section{border:1px solid #e5e7eb;box-shadow:0 3px 12px #17203308;padding:24px}h2{font-size:21px;margin:0 0 16px}h1{font-size:28px;margin:0 0 18px}input,select{background:#fff;min-height:46px}button{min-height:44px}button:hover{filter:brightness(.96)}th{background:#f1f5f9;color:#475569;font-weight:500}td{font-size:15px}tr:hover td{background:#fafafa}.stats section{border-top:4px solid var(--gold)}.stats b{font-size:36px}.hint{color:var(--muted);font-size:14px}.basket{background:#f8fafc;padding:14px;border-radius:12px;margin:12px 0}.basket div{display:flex;justify-content:space-between;align-items:center}.basket button{background:#fee2e2;color:#991b1b}#cam{grid-column:2}dialog{width:min(440px,90vw);box-shadow:0 20px 80px #0004}#who{background:#f0fdf4;padding:12px;border-radius:10px}#who:empty{display:none}@media(max-width:760px){main{padding:12px}#app:not([hidden]){display:block}nav{position:static;flex-direction:row;overflow:auto;flex-wrap:nowrap}nav button{white-space:nowrap}section{padding:16px}header{font-size:21px}h1{font-size:24px}}@media print{#app:not([hidden]){display:block}nav{display:none!important}}
</style><header>▥ BJ1 LIBRARY · V3.1 <small style="color:#ddd">โรงเรียนบรรหารแจ่มใสวิทยา 1</small></header><main><section id="login"><h2>เข้าสู่ระบบ</h2><form id="lf"><input id="username" placeholder="ชื่อผู้ใช้" required><input id="password" type="password" placeholder="รหัสผ่าน" required><button>เข้าสู่ระบบ</button></form></section><div id="app" hidden><nav id="nav"></nav><div id="view"></div><section id="cam" hidden><button onclick="stopCam()">ปิดกล้อง</button><div id="reader"></div></section></div></main><dialog id="pop"><h2 id="pt"></h2><p id="pm"></p><button onclick="$('pop').close()">ตกลง / สแกนต่อ</button></dialog><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
let token='',state,scanner,target,busy=false,books=[],member=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,args){if(!API)throw Error('ยังไม่ได้ตั้งค่า API');let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,args,token})});let j=await r.json();if(!j.ok)throw Error(j.error);return j.data}function msg(s,ok=true){$('pt').textContent=ok?'✓ สำเร็จ':'ไม่สำเร็จ';$('pt').style.color=ok?'#16834b':'#b91c1c';$('pm').textContent=s;if(!$('pop').open)$('pop').showModal();try{let a=new AudioContext(),o=a.createOscillator();o.frequency.value=ok?850:250;o.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){msg(e.message,false)}finally{busy=false}}$('lf').onsubmit=e=>{e.preventDefault();run(async()=>{token=(await api('login',[$('username').value,$('password').value])).token;$('password').value='';state=await api('init');$('login').hidden=true;$('app').hidden=false;nav();await page('home')})};function nav(){let items=[['home','▦  ภาพรวม'],['borrow','＋  ยืมหนังสือ'],['return','↩  คืนหนังสือ'],['renew','◷  ต่ออายุ'],['visit','▣  เข้าใช้บริการ'],['catalog','▤  ทะเบียนหนังสือ'],['report','▥  รายงาน'],['reservations','จองหนังสือ'],['inventory','ตรวจนับ'],['fines','ค่าปรับ'],['labels','พิมพ์บาร์โค้ด'],['stats','สถิติ']];if(state.user.admin)items.push(['settings','ตั้งค่า'],['users','บัญชี'],['audit','ประวัติระบบ']);$('nav').innerHTML=items.map(([k,v])=>`<button data-page="${k}" onclick="run(()=>page('${k}'))">${v}</button>`).join('')+'<button onclick="run(async()=>{await api(\'logout\');location.reload()})">ออกจากระบบ</button>'}function table(h,r){return '<div class="scroll"><table><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function scanField(id,label){return `<form onsubmit="event.preventDefault();run(()=>scan('${id}'))"><input id="${id}" placeholder="${label}" autocomplete="off" required><button>ยืนยัน</button><button type="button" onclick="run(()=>camera('${id}'))">เปิดกล้อง</button></form>`}async function page(k){await stopCam();let v=$('view');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===k));if(['reservations','inventory','fines','labels','stats','audit'].includes(k)){await extraPage(k);return;}if(k==='home'){state=await api('init');v.innerHTML='<h1>ภาพรวมห้องสมุด</h1><div class="stats">'+[['หนังสือ',state.books],['กำลังยืม',state.active],['เกินกำหนด',state.overdue],['เข้าใช้วันนี้',state.visits]].map(([a,b])=>`<section>${a}<b>${b}</b></section>`).join('')+'</div><section><h2>รายการยืมล่าสุด</h2>'+loanTable(state.recent)+'</section>'}else if(k==='borrow'){books=[];member=null;v.innerHTML='<section><h2>1. สแกนบัตรนักเรียน</h2>'+scanField('member','รหัสนักเรียน')+'<p id="who"></p><h2>2. สแกนหนังสือ</h2>'+scanField('book','บาร์โค้ดหนังสือ')+'<div id="basket" class="basket">ยังไม่มีหนังสือในรายการ</div><button onclick="run(confirmBorrow)">ยืนยันการยืม</button></section>';$('member').focus()}else if(['return','renew','visit'].includes(k)){v.innerHTML='<section><h2>'+({return:'คืนหนังสือ',renew:'ต่ออายุ',visit:'เข้าใช้ห้องสมุด'}[k])+'</h2>'+scanField(k,k==='visit'?'รหัสนักเรียน':'บาร์โค้ดหนังสือ')+'</section>' ;$(k).focus()}else if(k==='catalog'){let r=await api('catalog');v.innerHTML='<section><h2>ทะเบียนหนังสือ</h2><input placeholder="ค้นหา" oninput="filterRows(this.value)">'+table(['รหัส','ชื่อเรื่อง','ผู้แต่ง','ISBN','หมวด','ชั้นวาง','สถานะ'],r)+'</section>';if(state.user.admin)v.innerHTML+='<section><h2>นำเข้าทะเบียน Excel / CSV</h2><p class="hint">หัวตาราง id,title,author,isbn,category,shelf (สูงสุด 500 เล่ม)</p><input type="file" id="csvfile" accept=".csv,.xlsx,.xls"><button onclick="run(importBooks)">นำเข้า</button><button onclick="run(editBook)">แก้ไขหนังสือตามรหัส</button></section><section><h2>เพิ่มหนังสือ</h2><form onsubmit="event.preventDefault();run(async()=>{msg(await api(\'book\',Array.from(this.querySelectorAll(\'input\')).map(x=>x.value)));await page(\'catalog\')})">'+['รหัสประจำเล่ม','ชื่อเรื่อง','ผู้แต่ง','ISBN','หมวด','ชั้นวาง'].map((x,i)=>`<input placeholder="${x}" ${i<2?'required':''}>`).join('')+'<button>บันทึก</button></form></section>'}else if(k==='report'){let r=await api('loans'),vst=await api('visits');v.innerHTML='<section><h2>ประวัติยืม–คืน</h2><button onclick="download(0)">CSV</button><button onclick="print()">พิมพ์ / PDF</button>'+loanTable(r)+'</section><section><h2>ประวัติเข้าใช้</h2><button onclick="download(1)">CSV</button>'+table(['วันที่','เวลา','รหัส','ชื่อ','ชั้น'],vst)+'</section>'}else if(k==='settings'){let c=state.settings;v.innerHTML='<section><h2>ระเบียบการยืม</h2><form onsubmit="event.preventDefault();run(async()=>{state.settings=await api(\'settings\',Object.fromEntries(new FormData(this)));msg(\'บันทึกแล้ว\')})">'+Object.entries(c).map(([k,v])=>`<label>${({year:'ปีการศึกษา',term:'ภาคเรียน',limit:'จำนวนเล่ม',days:'วันยืม',fine:'ค่าปรับ/วัน',renew:'จำนวนครั้งต่ออายุ'}[k])}<input name="${k}" value="${esc(v)}" type="number" required></label><br>`).join('')+'<button>บันทึก</button></form></section>'}else if(k==='users'){v.innerHTML='<section><h2>บัญชีผู้ใช้</h2>'+table(['ชื่อ','สิทธิ์','สถานะ'],await api('users'))+'<form onsubmit="event.preventDefault();run(async()=>{await api(\'account\',{name:this.elements.un.value,password:this.elements.pw.value,role:this.elements.role.value,active:this.elements.active.checked});msg(\'บันทึกแล้ว\');await page(\'users\')})"><input name="un" placeholder="Username" required><input name="pw" type="password" placeholder="รหัสผ่านใหม่ (12 ตัวขึ้นไป)"><select name="role"><option value="teacher">บรรณารักษ์</option><option value="admin">Admin</option></select><label><input name="active" type="checkbox" checked>เปิดบัญชี</label><button>บันทึก</button></form></section>'}}function loanTable(r){return table(['รหัสรายการ','หนังสือ','รหัสสมาชิก','ชื่อ','ชั้น','ยืม','กำหนดคืน','คืน','ต่ออายุ','ค่าปรับ','เจ้าหน้าที่'],r)}function filterRows(s){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(s.toLowerCase()))}async function scan(id){let el=$(id),x=el.value.trim();if(!x)return;if(id==='member'){member=await api('member',x);$('who').textContent=member.name+' • '+member.class;el.value='';$('book').focus()}else if(id==='book'){if(!member)throw Error('สแกนสมาชิกก่อน');if(books.some(b=>b[0]===x))throw Error('สแกนหนังสือเล่มนี้แล้ว');books.push(await api('bookInfo',x));renderBasket();el.value='';el.focus()}else{msg(await api(id,x));el.value='';el.focus()}}function renderBasket(){$('basket').innerHTML=books.length?books.map((b,i)=>`<div><span>${esc(b[1])} · ${esc(b[0])}</span><button onclick="books.splice(${i},1);renderBasket()">ลบ</button></div>`).join(''):'ยังไม่มีหนังสือในรายการ';}async function confirmBorrow(){if(!member)throw Error('สแกนสมาชิกก่อน');msg(await api('borrow',{member:member.id,books:books.map(b=>b[0])}));await page('borrow')}async function camera(id){await stopCam();$('cam').hidden=false;scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:100}},async code=>{if(busy)return;await run(async()=>{await stopCam();$(id).value=code;await scan(id)})})}async function stopCam(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}$('cam').hidden=true}function download(i){let t=document.querySelectorAll('table')[i],csv=Array.from(t.rows).map(r=>Array.from(r.cells).map(c=>'"'+c.textContent.replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));a.download='BJ1-library.csv';a.click();URL.revokeObjectURL(a.href)}

function parseCSV(t){let out=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(!q&&c===','){r.push(v);v=''}else if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(Boolean))out.push(r);r=[];v=''}else v+=c}if(q)throw Error('CSV ไม่ถูกต้อง');r.push(v);if(r.some(Boolean))out.push(r);return out}async function importBooks(){let f=$('csvfile').files[0];if(!f)throw Error('เลือกไฟล์ CSV');let r;if(/\.xlsx?$/i.test(f.name)||/\.xls$/i.test(f.name)){let w=XLSX.read(await f.arrayBuffer());r=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:false,defval:''}).filter(a=>a.some(Boolean));}else r=parseCSV((await f.text()).replace(/^\uFEFF/,''));if(r.shift().join(',')!=='id,title,author,isbn,category,shelf')throw Error('หัวตารางไม่ตรง');if(!confirm('นำเข้า '+r.length+' เล่ม?'))return;msg(await api('importBooks',r));await page('catalog')}async function editBook(){let id=prompt('รหัสประจำเล่ม');if(!id)return;let r=(await api('catalog')).find(b=>b[0]===id);if(!r)throw Error('ไม่พบหนังสือ');for(let i=1;i<7;i++){let v=prompt(['','ชื่อเรื่อง','ผู้แต่ง','ISBN','หมวด','ชั้นวาง','สถานะ active / inactive'][i],r[i]);if(v===null)return;r[i]=v}msg(await api('editBook',r));await page('catalog')}

async function extraPage(k){let v=$('view');if(k==='reservations'){v.innerHTML='<section><h2>จองหนังสือ</h2><form id="reserveForm"><input name="member" placeholder="รหัสนักเรียน" required><input name="book" placeholder="รหัสหนังสือ" required><button>จอง</button></form><form id="cancelForm"><input name="id" placeholder="รหัสรายการจอง" required><button>ยกเลิกจอง</button></form>'+table(['รายการ','หนังสือ','สมาชิก','ชื่อ','วันที่','สถานะ'],await api(k))+'</section>';bindForm('reserveForm','reserve',k);bindForm('cancelForm','cancelReserve',k,x=>x.id)}else if(k==='inventory'){v.innerHTML='<section><h2>ตรวจนับหนังสือ</h2><input id="round" placeholder="รหัสรอบ เช่น 2569-1"><form id="countForm"><input name="book" placeholder="สแกนรหัสหนังสือ" required><button>บันทึก</button></form><button id="showCount">ดูผลตรวจนับ</button><div id="countResult"></div></section>';const show=async()=>{$('countResult').innerHTML=table(['รหัส','ชื่อ','ผลตรวจ'],await api('inventory',{round:$('round').value}))};$('showCount').onclick=()=>run(show);$('countForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('countBook',{round:$('round').value,book:e.target.elements.book.value});e.target.reset();await show();e.target.elements.book.focus()})}}else if(k==='fines'){v.innerHTML='<section><h2>ค่าปรับค้างชำระ</h2>'+table(['รายการยืม','ชื่อ','หนังสือ','ค่าปรับ','คงเหลือ'],await api(k))+(state.user.admin?'<form id="payForm"><input name="loan" placeholder="รหัสรายการยืม" required><input name="amount" type="number" min="0.01" step="0.01" required><select name="type"><option value="paid">ชำระ</option><option value="waived">ยกเว้น</option></select><button>บันทึก</button></form>':'')+'</section>';if(state.user.admin)bindForm('payForm','payFine',k)}else if(k==='labels'){let b=await api('catalog');v.innerHTML='<section><h2>พิมพ์บาร์โค้ด Code 128</h2><input id="labelQuery" placeholder="ค้นหารหัสหรือชื่อ"><button id="makeLabels">สร้างป้าย (สูงสุด 100)</button><button onclick="print()">พิมพ์</button><div id="labelsGrid"></div></section>';$('makeLabels').onclick=()=>{let q=$('labelQuery').value.toLowerCase();let r=b.filter(r=>r.slice(0,2).join(' ').toLowerCase().includes(q)).slice(0,100);$('labelsGrid').innerHTML=r.map((r,i)=>`<div class="barcodeLabel"><small>${esc(r[1])}</small><svg id="bc${i}"></svg></div>`).join('');r.forEach((r,i)=>JsBarcode('#bc'+i,r[0],{format:'CODE128',height:40,width:1.5,fontSize:12}))}}else if(k==='stats'){let d=await api(k);let bars=r=>r.map(([n,c])=>`<div>${esc(n)} · ${c}<div style="background:#eab308;height:8px;width:${100*c/Math.max(1,...r.map(x=>x[1]))}%"></div></div>`).join('');v.innerHTML='<section><h2>หนังสือยอดนิยม</h2>'+bars(d.books)+'</section><section><h2>นักอ่านยอดนิยม</h2>'+bars(d.readers)+'</section><section><h2>หนังสือค้างส่ง</h2>'+loanTable(d.overdue)+'</section>'}else v.innerHTML='<section><h2>ประวัติการทำรายการ</h2>'+table(['เวลา UTC','ผู้ใช้','คำสั่ง','อ้างอิง'],await api(k))+'</section>'}
function bindForm(id,a,k,transform=x=>x){$(id).onsubmit=e=>{e.preventDefault();run(async()=>{msg(await api(a,transform(Object.fromEntries(new FormData(e.target)))));await page(k)})}}
</script><style>#labelsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.barcodeLabel{background:white;color:black;border:1px solid #ddd;text-align:center;padding:6px;break-inside:avoid}.barcodeLabel svg{max-width:100%}@media print{body:has(#labelsGrid) header,body:has(#labelsGrid) #view h2,body:has(#labelsGrid) #view input,body:has(#labelsGrid) #view button{display:none}}</style><style>
#view{min-width:0}.scan-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.scan-form input{flex:1 1 200px;min-width:0;font-size:18px;border:2px solid #d1d5db}.scan-form input:focus{outline:3px solid #fde68a;border-color:#ca8a04}.scan-form button{margin:0}.scan-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.scan-tools button{background:#e8edf4}.scan-history{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.scan-history p{margin:5px 0;overflow-wrap:anywhere}#cam:not([hidden]){position:fixed;z-index:10;inset:auto 16px 16px auto;width:min(440px,calc(100vw - 32px));max-height:80dvh;overflow:auto;box-shadow:0 8px 50px #0005}#reader{width:100%}#reader video{max-width:100%}body.kiosk nav,body.kiosk header{display:none}body.kiosk #app:not([hidden]){display:block}body.kiosk #view{max-width:900px;margin:auto}body.kiosk main{padding-top:24px}button:focus-visible{outline:3px solid #a16207}dialog{max-height:85dvh;overflow:auto}input,select,button{font-size:16px} .scroll{-webkit-overflow-scrolling:touch;max-width:100%}
