<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJ1 Library</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f4;color:#171717;font-family:Kanit,sans-serif}header{background:#171717;color:#ffd32a;padding:22px;font-size:26px}small{display:block;color:#777}main{max-width:1100px;margin:auto;padding:18px}section,.card{background:white;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 2px 12px #0001}input,button,select{font:inherit;padding:12px;border:1px solid #ddd;border-radius:9px;margin:4px;max-width:100%}button{background:#ffd32a;border:0;cursor:pointer;font-weight:500}nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.stats b{font-size:30px;display:block}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}.scroll{overflow:auto}dialog{border:0;border-radius:18px;padding:28px;max-width:90%;text-align:center}dialog::backdrop{background:#0008}#reader{max-width:420px} [hidden]{display:none!important} @media print{header,nav,button,#login,#reader{display:none!important}}</style><header>▥ BJ1 LIBRARY <small style="color:#ddd">โรงเรียนบรรหารแจ่มใสวิทยา 1</small></header><main><section id="login"><h2>เข้าสู่ระบบ</h2><form id="lf"><input id="username" placeholder="ชื่อผู้ใช้" required><input id="password" type="password" placeholder="รหัสผ่าน" required><button>เข้าสู่ระบบ</button></form></section><div id="app" hidden><nav id="nav"></nav><div id="view"></div><section id="cam" hidden><button onclick="stopCam()">ปิดกล้อง</button><div id="reader"></div></section></div></main><dialog id="pop"><h2 id="pt"></h2><p id="pm"></p><button onclick="pop.close()">ตกลง</button></dialog><script>
let token='',state,scanner,target,busy=false,books=[],member=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,args){if(!API)throw Error('ยังไม่ได้ตั้งค่า API');let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,args,token})});let j=await r.json();if(!j.ok)throw Error(j.error);return j.data}function msg(s,ok=true){$('pt').textContent=ok?'✓ สำเร็จ':'ไม่สำเร็จ';$('pt').style.color=ok?'#16834b':'#b91c1c';$('pm').textContent=s;if(!$('pop').open)$('pop').showModal();try{let a=new AudioContext(),o=a.createOscillator();o.frequency.value=ok?850:250;o.connect(a.destination);o.start();o.stop(a.currentTime+.15)}catch(e){}}async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){msg(e.message,false)}finally{busy=false}}$('lf').onsubmit=e=>{e.preventDefault();run(async()=>{token=(await api('login',[$('username').value,$('password').value])).token;$('password').value='';state=await api('init');$('login').hidden=true;$('app').hidden=false;nav();await page('home')})};function nav(){let items=[['home','ภาพรวม'],['borrow','ยืม'],['return','คืน'],['renew','ต่ออายุ'],['visit','เข้าใช้'],['catalog','หนังสือ'],['report','รายงาน']];if(state.user.admin)items.push(['settings','ตั้งค่า'],['users','บัญชี']);$('nav').innerHTML=items.map(([k,v])=>`<button onclick="run(()=>page('${k}'))">${v}</button>`).join('')+'<button onclick="run(async()=>{await api(\'logout\');location.reload()})">ออกจากระบบ</button>'}function table(h,r){return '<div class="scroll"><table><thead><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}function scanField(id,label){return `<form onsubmit="event.preventDefault();run(()=>scan('${id}'))"><input id="${id}" placeholder="${label}" autocomplete="off" required><button>ยืนยัน</button><button type="button" onclick="run(()=>camera('${id}'))">เปิดกล้อง</button></form>`}async function page(k){await stopCam();let v=$('view');if(k==='home'){state=await api('init');v.innerHTML='<div class="stats">'+[['หนังสือ',state.books],['กำลังยืม',state.active],['เกินกำหนด',state.overdue],['เข้าใช้วันนี้',state.visits]].map(([a,b])=>`<section>${a}<b>${b}</b></section>`).join('')+'</div><section><h2>รายการยืมล่าสุด</h2>'+loanTable(state.recent)+'</section>'}else if(k==='borrow'){books=[];member=null;v.innerHTML='<section><h2>1. สแกนบัตรนักเรียน</h2>'+scanField('member','รหัสนักเรียน')+'<p id="who"></p><h2>2. สแกนหนังสือ</h2>'+scanField('book','บาร์โค้ดหนังสือ')+'<div id="basket"></div><button onclick="run(confirmBorrow)">ยืนยันการยืม</button></section>';$('member').focus()}else if(['return','renew','visit'].includes(k)){v.innerHTML='<section><h2>'+({return:'คืนหนังสือ',renew:'ต่ออายุ',visit:'เข้าใช้ห้องสมุด'}[k])+'</h2>'+scanField(k,k==='visit'?'รหัสนักเรียน':'บาร์โค้ดหนังสือ')+'</section>' ;$(k).focus()}else if(k==='catalog'){let r=await api('catalog');v.innerHTML='<section><h2>ทะเบียนหนังสือ</h2><input placeholder="ค้นหา" oninput="filterRows(this.value)">'+table(['รหัส','ชื่อเรื่อง','ผู้แต่ง','ISBN','หมวด','ชั้นวาง','สถานะ'],r)+'</section>';if(state.user.admin)v.innerHTML+='<section><h2>เพิ่มหนังสือ</h2><form onsubmit="event.preventDefault();run(async()=>{msg(await api(\'book\',Array.from(this.querySelectorAll(\'input\')).map(x=>x.value)));await page(\'catalog\')})">'+['รหัสประจำเล่ม','ชื่อเรื่อง','ผู้แต่ง','ISBN','หมวด','ชั้นวาง'].map((x,i)=>`<input placeholder="${x}" ${i<2?'required':''}>`).join('')+'<button>บันทึก</button></form></section>'}else if(k==='report'){let r=await api('loans'),vst=await api('visits');v.innerHTML='<section><h2>ประวัติยืม–คืน</h2><button onclick="download(0)">CSV</button><button onclick="print()">พิมพ์ / PDF</button>'+loanTable(r)+'</section><section><h2>ประวัติเข้าใช้</h2><button onclick="download(1)">CSV</button>'+table(['วันที่','เวลา','รหัส','ชื่อ','ชั้น'],vst)+'</section>'}else if(k==='settings'){let c=state.settings;v.innerHTML='<section><h2>ระเบียบการยืม</h2><form onsubmit="event.preventDefault();run(async()=>{state.settings=await api(\'settings\',Object.fromEntries(new FormData(this)));msg(\'บันทึกแล้ว\')})">'+Object.entries(c).map(([k,v])=>`<label>${({year:'ปีการศึกษา',term:'ภาคเรียน',limit:'จำนวนเล่ม',days:'วันยืม',fine:'ค่าปรับ/วัน',renew:'จำนวนครั้งต่ออายุ'}[k])}<input name="${k}" value="${esc(v)}" type="number" required></label><br>`).join('')+'<button>บันทึก</button></form></section>'}else if(k==='users'){v.innerHTML='<section><h2>บัญชีผู้ใช้</h2>'+table(['ชื่อ','สิทธิ์','สถานะ'],await api('users'))+'<form onsubmit="event.preventDefault();run(async()=>{await api(\'account\',{name:this.elements.un.value,password:this.elements.pw.value,role:this.elements.role.value,active:this.elements.active.checked});msg(\'บันทึกแล้ว\');await page(\'users\')})"><input name="un" placeholder="Username" required><input name="pw" type="password" placeholder="รหัสผ่านใหม่ (12 ตัวขึ้นไป)"><select name="role"><option value="teacher">บรรณารักษ์</option><option value="admin">Admin</option></select><label><input name="active" type="checkbox" checked>เปิดบัญชี</label><button>บันทึก</button></form></section>'}}function loanTable(r){return table(['รหัสรายการ','หนังสือ','รหัสสมาชิก','ชื่อ','ชั้น','ยืม','กำหนดคืน','คืน','ต่ออายุ','ค่าปรับ','เจ้าหน้าที่'],r)}function filterRows(s){document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(s.toLowerCase()))}async function scan(id){let el=$(id),x=el.value.trim();if(!x)return;if(id==='member'){member=await api('member',x);$('who').textContent=member.name+' • '+member.class;el.value='';$('book').focus()}else if(id==='book'){if(!member)throw Error('สแกนสมาชิกก่อน');if(!books.includes(x))books.push(x);$('basket').textContent=books.join(' • ');el.value='';el.focus()}else{msg(await api(id,x));el.value='';el.focus()}}async function confirmBorrow(){if(!member)throw Error('สแกนสมาชิกก่อน');msg(await api('borrow',{member:member.id,books}));await page('borrow')}async function camera(id){await stopCam();$('cam').hidden=false;scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:100}},async code=>{if(busy)return;await run(async()=>{await stopCam();$(id).value=code;await scan(id)})})}async function stopCam(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null}$('cam').hidden=true}function download(i){let t=document.querySelectorAll('table')[i],csv=Array.from(t.rows).map(r=>Array.from(r.cells).map(c=>'"'+c.textContent.replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));a.download='BJ1-library.csv';a.click();URL.revokeObjectURL(a.href)}
</script></html>
