<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BJ1 OPAC</title><style>body{font:18px system-ui;background:#f4f5f7;margin:0}header{background:#171717;color:#facc15;padding:24px}main{max-width:900px;margin:auto;padding:20px}input{width:90%;padding:12px;font:inherit}article{background:white;padding:16px;margin:10px 0;border-radius:12px}</style><header>BJ1 LIBRARY | สืบค้นหนังสือ</header><main><input id="q" placeholder="ค้นหาชื่อ ผู้แต่ง ISBN"><p id="status">กำลังโหลด...</p><div id="results"></div></main><script src="config.js"></script><script>let data=[];const q=document.getElementById('q'),out=document.getElementById('results'),st=document.getElementById('status');function render(){out.replaceChildren();let r=data.filter(r=>r.join(' ').toLowerCase().includes(q.value.toLowerCase()));st.textContent='พบ '+r.length+' รายการ';r.slice(0,100).forEach(r=>{let a=document.createElement('article');a.textContent=r[1]+' • '+r[2]+' | ชั้น '+r[5]+' | '+r[6];out.append(a)})}q.oninput=render;fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'publicCatalog'})}).then(r=>r.json()).then(j=>{if(!j.ok)throw Error(j.error);data=j.data;render()}).catch(e=>st.textContent=e.message)</script></html>
